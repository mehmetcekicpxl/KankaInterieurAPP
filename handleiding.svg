<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#263238"/>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#37474F" stroke-width="2"/>
  </pattern>
  <rect width="400" height="400" fill="url(#grid)" />

  <g stroke="#455A64" stroke-width="2" fill="none" opacity="0.4">
    <rect x="50" y="50" width="100" height="150" />
    <circle cx="300" cy="100" r="40" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="200" y1="0" x2="200" y2="400" />
  </g>

  <rect width="400" height="400" fill="black" opacity="0.3"/>

  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="white" stroke-width="12"/>
    
    <text x="0" y="35" 
          font-family="Arial, sans-serif" 
          font-weight="900" 
          font-size="140" 
          fill="white" 
          text-anchor="middle">?</text>
  </g>
</svg>